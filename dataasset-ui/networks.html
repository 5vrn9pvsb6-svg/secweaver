<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>网络 · SecWeaver</title><link rel="stylesheet" href="./style.css" /></head>
  <body data-module="network">
    <div class="grain"></div>
    <header id="appTopbar" class="topbar"></header>
    <main class="workbench"><aside id="appSidebar" class="sidebar"></aside><section class="workspace"><section class="list-page"><div class="panel list-shell"><div class="list-header"><div><p id="listKicker" class="eyebrow">Resource</p><h2 id="listTitle">网络</h2><p id="listDescription" class="hint">选择一条记录进入详情。</p></div><div class="list-actions"><input id="moduleSearch" class="search" placeholder="搜索当前模块" /></div></div><div id="moduleList" class="asset-list table-list"></div></div></section><div id="emptyState" class="empty-state"><div class="empty-card"><span class="empty-mark">SW</span><h2>选择左侧列表中的对象</h2><p>对象详情会显示在这里。</p></div></div><section id="detailView" class="form hidden"><div class="form-toolbar editor-toolbar"><div><p id="detailKind" class="eyebrow">Object</p><h2 id="detailTitle">未选择</h2></div><div class="status-row"><span id="detailFile" class="pill muted">只读</span><span id="detailStatus" class="save-status"></span><button id="saveDetailBtn" class="button primary hidden" type="button">保存</button></div></div><section class="panel"><h3>对象摘要</h3><div id="detailSummary" class="detail-summary"></div></section><section class="panel raw-panel"><div class="panel-title-row"><h3>原始 JSON</h3><span id="detailHint" class="hint">当前为只读浏览。</span></div><textarea id="detailRawJson" rows="24" spellcheck="false"></textarea></section></section></section></main>
    <script src="./i18n.js"></script><script src="./shared-nav.js"></script>
    <script src="./module-page-config.js"></script><script src="./module-page-utils.js"></script><script src="./module-page-list.js"></script><script src="./module-page-editors.js"></script><script src="./module-page.js"></script>
  </body>
</html>
