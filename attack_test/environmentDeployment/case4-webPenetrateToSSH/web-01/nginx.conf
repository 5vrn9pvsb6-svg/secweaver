server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
    index index.php;

    client_max_body_size 10m;

    # Standard access log (combined format)
    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log warn;

    location / {
        try_files $uri $uri/ =404;
    }

    # PHP + PHTML processing
    # VULNERABILITY: .phtml is processed as PHP
    # The upload handler blacklists .php but NOT .phtml
    location ~ \.(php|phtml)$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 300;
    }

    # Uploads directory — autoindex is an info leak
    location /uploads/ {
        autoindex on;
    }

    # Server info leak
    location /server-status {
        stub_status on;
    }
}
